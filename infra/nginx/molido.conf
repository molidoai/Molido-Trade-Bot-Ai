# Reverse proxy for Molido Trade Bot AI.
# listen 80. / -> frontend:3000, /api -> api:8000 (compose service names).
# If nginx runs on the host instead of the compose network, use 127.0.0.1:3000 / 127.0.0.1:8000.
#
# HTTPS / certbot: uncomment the ssl server block AFTER you have a real domain.
# Do not invent a domain here.

upstream molido_web {
    server frontend:3000;
}

upstream molido_api {
    server api:8000;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /api {
        proxy_pass http://molido_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://molido_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

