# Reverse proxy for Molido Trade Bot AI.
# Domain per docs/DEPLOY_MTRADE.md: MTrade.molido.shop — change if you deploy
# under a different name. After certbot issues a cert, certbot --nginx will
# rewrite the port-80 block to redirect and fill in the 443 block below (or
# uncomment/adjust it by hand); until then this only serves HTTP.

limit_req_zone $binary_remote_addr zone=molido_api:10m rate=10r/s;

upstream molido_api {
    server 127.0.0.1:8000;
}
upstream molido_web {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name MTrade.molido.shop;

    # After certbot: this block becomes a redirect to https://, and the
    # server{} below (or one certbot writes) terminates TLS on 443.
    # return 301 https://$host$request_uri;

    location /api/ {
        proxy_pass http://molido_api;
        proxy_set_header Host $host;
        # Overwrite (not append) so a client-supplied X-Real-IP/X-Forwarded-For
        # can never spoof the IP used for login rate-limiting in the API.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        limit_req zone=molido_api burst=20 nodelay;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location / {
        proxy_pass http://molido_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}

