# Sample reverse proxy – replace server_name with your domain
upstream molido_api {
    server 127.0.0.1:8000;
}
upstream molido_web {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name trade.example.com;
    # After certbot: redirect to HTTPS

    location /api/ {
        proxy_pass http://molido_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://molido_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
