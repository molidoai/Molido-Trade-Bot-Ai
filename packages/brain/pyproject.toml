[project]
name = "molido-brain"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["molido-shared", "molido-signals", "molido-regime"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["molido_brain*"]
